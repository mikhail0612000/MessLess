<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>MessLess</title>
<style>
:root{color-scheme:light;--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--line:rgba(11,11,11,.12);--acc:#2a78d6;--bad:#d03b3b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--line:rgba(255,255,255,.12);--acc:#3987e5}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center}
h1{font-size:22px;margin:0 0 4px}p{color:var(--ink2);margin:0 0 20px;font-size:14px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:transparent;color:inherit}
input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 16px;color:var(--ink2);font-size:13px}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f"><h1>MessLess</h1><p>Отчёт защищён паролем</p>
<input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
<label><input id="rm" type="checkbox"> Запомнить на этом устройстве</label>
<button id="b">Открыть</button><div class="err" id="e"></div></form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw,remember){
  if(!window.crypto||!crypto.subtle) throw new Error("nosubtle");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,
    {name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.d));
  if(remember){try{localStorage.setItem("ml_pw",pw)}catch(e){}}
  const html=new TextDecoder().decode(buf);
  document.open();document.write(html);document.close();
}
